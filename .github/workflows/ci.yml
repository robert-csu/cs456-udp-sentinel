# CLAUDE generated yaml file


# CI: build and check the repo on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck

      - name: Build (warnings are errors)
        run: make CFLAGS="-Wall -Wextra -Werror -pthread -g"

      - name: Check all programs were built
        run: |
          for p in sentinel monitor client; do
            test -x "$p" || { echo "::error::$p was not built"; exit 1; }
            echo "$p built OK"
          done

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 --inline-suppr --quiet \
                   -I src src/

      - name: Check Python scripts compile
        run: |
          shopt -s nullglob
          files=(scripts/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python scripts yet, skipping."
          else
            python3 -m py_compile "${files[@]}"
            echo "Checked: ${files[*]}"
          fi

      - name: make clean works
        run: |
          make clean
          for p in sentinel monitor client; do
            test ! -e "$p" || { echo "::error::$p not removed by make clean"; exit 1; }
          done
